# preflight:secrets — credentials that must not reach a remote branch.
#
# Deliberately narrow. Broad secret scanners produce enough false positives to
# get themselves disabled, and a disabled check protects nothing. This matches
# credential shapes that are unambiguous: provider-issued key formats and
# private key blocks.
version: 1

checks:
  - name: no-committed-secrets
    when: ["**"]
    not:
      - "**/*.example"
      - "**/*.sample"
      - "**/*.lock"
      - "**/package-lock.json"
      - "**/node_modules/**"
      - "**/*.min.js"
      - "**/*.map"
    run: node {here}/scripts/secret-scan.js {files}
    budget: 10s
    why: >
      A credential that reaches a remote branch is compromised even if the
      next commit removes it — rotation is the only real fix, and it is
      always more expensive than the ten seconds this check costs. Add a
      `preflight-ignore` comment on the line for a genuine false positive.
